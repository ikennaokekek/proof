name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    environment: slice1-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/proof run lint
      - run: pnpm --filter @workspace/proof run test
      - name: Require acceptance database configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
        run: test -n "$DATABASE_URL"
      - run: pnpm --filter @workspace/proof run test:integration
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
      - run: pnpm --filter @workspace/proof run build

  hosted-supabase-e2e:
    runs-on: ubuntu-latest
    environment: slice1-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require isolated hosted Supabase test configuration
        shell: bash
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          SUPABASE_TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
        run: |
          test -n "$SUPABASE_TEST_URL"
          test -n "$SUPABASE_TEST_PUBLISHABLE_KEY"
          test -n "$SUPABASE_TEST_DATABASE_URL"
          case "$SUPABASE_TEST_URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_TEST_URL must identify an isolated hosted Supabase project" >&2; exit 1 ;;
          esac
      - run: pnpm --filter @workspace/proof exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/proof run test:e2e
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          SUPABASE_TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}

  dependency-and-secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2