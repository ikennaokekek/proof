openapi: 3.1.0
info:
  title: PROOF API
  version: 0.2.0
  description: PROOF Slice 2 organization membership, invitations, and approval authority API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: authentication
  - name: organizations
  - name: memberships
  - name: invitations
  - name: approval-authority
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [authentication]
      responses:
        "200":
          description: Current application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [authentication]
      responses:
        "204":
          description: Signed out
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      responses:
        "200":
          description: Organizations available to the authenticated human
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organizations/{organizationId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization available to the authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
  /organizations/{organizationId}/invitations:
    get:
      operationId: listOrganizationInvitations
      tags: [invitations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createOrganizationInvitation
      tags: [invitations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitation created; token is returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/{organizationId}/invitations/{invitationId}/revoke:
    post:
      operationId: revokeOrganizationInvitation
      tags: [invitations]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationInput" }
      responses:
        "201":
          description: Invitation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/{organizationId}/members:
    get:
      operationId: listOrganizationMembers
      tags: [memberships]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /organizations/{organizationId}/members/{memberId}:
    patch:
      operationId: updateOrganizationMember
      tags: [memberships]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdateInput" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/{organizationId}/authorities:
    get:
      operationId: listApprovalAuthorities
      tags: [approval-authority]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Active approval authorities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalAuthority" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: grantApprovalAuthority
      tags: [approval-authority]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorityInput" }
      responses:
        "201":
          description: Approval authority granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalAuthority" }
        "202":
          description: Authority increase is pending approval from a different Owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalAuthorityRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/{organizationId}/authority-requests:
    get:
      operationId: listApprovalAuthorityRequests
      tags: [approval-authority]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Approval Authority governance requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalAuthorityRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /organizations/{organizationId}/authority-requests/{requestId}/approve:
    post:
      operationId: approveApprovalAuthorityRequest
      tags: [approval-authority]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AuthorityRequestId"
      responses:
        "200":
          description: Approval Authority granted after independent Owner approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalAuthority" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/{organizationId}/authorities/{authorityId}:
    delete:
      operationId: revokeApprovalAuthority
      tags: [approval-authority]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AuthorityId"
      responses:
        "200":
          description: Revoked approval authority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalAuthority" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Operation conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      in: path
      name: memberId
      required: true
      schema: { type: string, format: uuid }
    AuthorityId:
      in: path
      name: authorityId
      required: true
      schema: { type: string, format: uuid }
    AuthorityRequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    InvitationInput:
      type: object
      additionalProperties: false
      required: [email, roles, jobTitle]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        roles:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, enum: [Requester, Approver, Auditor] }
        jobTitle: { type: string, minLength: 2, maxLength: 100 }
    AcceptInvitationInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
    MemberUpdateInput:
      type: object
      additionalProperties: false
      required: [roles, active, jobTitle]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/ProofRole" }
        active: { type: boolean }
        jobTitle: { type: string, minLength: 2, maxLength: 100 }
    AuthorityInput:
      type: object
      additionalProperties: false
      required: [memberId, category]
      properties:
        memberId: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/AuthorityCategory" }
    Invitation:
      type: object
      required: [id, email, roles, job_title, expires_at, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [Requester, Approver, Auditor] }
        job_title: { type: string }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    InvitationCreateResult:
      type: object
      additionalProperties: false
      required: [invitation, token]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        token: { type: string, minLength: 32 }
    Member:
      type: object
      additionalProperties: false
      required: [id, user_id, roles, job_title, active, joined_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/ProofRole" }
        job_title: { type: string }
        active: { type: boolean }
        joined_at: { type: string, format: date-time }
    ApprovalAuthority:
      type: object
      required: [id, member_id, category, created_at, active]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/AuthorityCategory" }
        created_at: { type: string, format: date-time }
        active: { type: boolean }
        revoked_at: { type: string, format: date-time, nullable: true }
    ApprovalAuthorityRequest:
      type: object
      additionalProperties: false
      required: [id, member_id, category, requested_by, status, created_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/AuthorityCategory" }
        requested_by: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved] }
        created_at: { type: string, format: date-time }
        decided_by: { type: string, format: uuid, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        authority_id: { type: string, format: uuid, nullable: true }
    ProofRole:
      type: string
      enum: [Owner, Admin, Requester, Approver, Auditor]
    AuthorityCategory:
      type: string
      enum: [payment, supplier_bank_detail_change]
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    AuthCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    AuthResult:
      type: object
      required: [authenticated, message]
      properties:
        authenticated:
          type: boolean
        message:
          type: string
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: "null"
    SessionUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name, jobTitle, establishmentCapacity, eligibilityAttested]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        jobTitle:
          type: string
          minLength: 2
          maxLength: 100
        establishmentCapacity:
          type: string
          enum: [chief_executive, business_owner, chief_financial_officer, finance_director]
        eligibilityAttested:
          type: boolean
          const: true
    Organization:
      type: object
      required: [id, name, membershipRoles, jobTitle, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        membershipRoles:
          type: array
          items:
            type: string
            enum: [Owner, Admin, Requester, Approver, Auditor]
        jobTitle:
          type: string
        createdAt:
          type: string
          format: date-time
    Membership:
      type: object
      required: [userId, roles, jobTitle, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [Owner, Admin, Requester, Approver, Auditor]
        jobTitle:
          type: string
        joinedAt:
          type: string
          format: date-time
    OrganizationDetail:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/Membership"